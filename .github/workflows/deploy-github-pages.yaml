name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare artifact
        run: |
          # 只保留构建产物，删除源码文件以减少 artifact 大小
          rm -rf node_modules quartz .quartz content docs cloudflare-worker
          rm -f *.ts *.tsx *.json *.yaml Dockerfile globals.d.ts index.d.ts tsconfig.json
          rm -f .prettier* .npmrc .node-version .gitattributes CODE_OF_CONDUCT.md LICENSE.txt README.md quartz.config.default.yaml
          ls -la

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
